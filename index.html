<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Poet's Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Poet's Room</h1>
    </header>
    <main id="poem-container">
        <!-- Poems will be injected here by JavaScript -->
    </main>

    <script src="poems.js"></script>
    <script>
        // Function to render the poems from your poems.js file
        const container = document.getElementById('poem-container');
        if (typeof poems !== 'undefined' && Array.isArray(poems)) {
            poems.forEach(poem => {
                const card = document.createElement('div');
                card.className = 'poem-card';
                
                let linesHTML = '';
                if (poem.lines) {
                    poem.lines.forEach(line => {
                        linesHTML += `<p>${line}</p>`;
                    });
                }

                card.innerHTML = `
                    <h2>${poem.title}</h2>
                    <div class="meta">${poem.date} • ${poem.tags.join(', ')}</div>
                    <div class="poem-content">${linesHTML}</div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
