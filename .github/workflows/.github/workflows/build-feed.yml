name: Build RSS feed

on:
  push:
    branches: [main]
    paths:
      - 'poems.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate feed.xml
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const src = fs.readFileSync('poems.js', 'utf8');
          const match = src.match(/const poems\s*=\s*(\[[\s\S]*?\]);/);
          if (!match) { console.error('Could not find poems array'); process.exit(1); }
          const poems = eval(match[1]);
          const base = 'https://the-poets-room.github.io/the-poets-room';
          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const items = poems.map(p => {
            const excerpt = (p.lines || []).slice(0,2).join(' ');
            const date = new Date(p.date || Date.now()).toUTCString();
            return `    <item>
              <title>${esc(p.title)}</title>
              <link>${base}/poem.html?id=${encodeURIComponent(p.id)}</link>
              <guid>${base}/poem.html?id=${encodeURIComponent(p.id)}</guid>
              <pubDate>${date}</pubDate>
              <description>${esc(excerpt)}</description>
            </item>`;
          }).join('\n');
          const xml = `<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">
            <channel>
              <title>The Poet's Room</title>
              <link>${base}/</link>
              <description>Poems by Privilege Akrofi · Privilege the Poet</description>
              <language>en</language>
              <atom:link href="${base}/feed.xml" rel="self" type="application/rss+xml" />
          ${items}
            </channel>
          </rss>`;
          fs.writeFileSync('feed.xml', xml);
          console.log('feed.xml written with', poems.length, 'poems');
          EOF
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Auto-update feed.xml"
          git push
